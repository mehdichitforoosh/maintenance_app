name: maintenance_app
description: "Paper-free workshop maintenance: equipment, service, work orders, inventory."
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.3
  path: ^1.9.1
  intl: ^0.20.2

  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  flutter_native_splash: ^2.4.8
  go_router: ^18.0.1

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  uuid: ^4.6.0
  shamsi_date: ^1.1.1
  persian_datetime_picker: ^3.2.0
  enefty_icons: ^1.0.10
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  crypto: ^3.0.6
  flutter_poolakey: ^2.2.0+1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:

  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: VazirmatnFD
      fonts:
        - asset: assets/fonts/Vazirmatn-RD-FD-Regular.ttf
