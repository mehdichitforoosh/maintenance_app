flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#12262B"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/app_icon_monochrome.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#12262B"
    theme_color: "#12262B"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/branding/app_icon.png"
